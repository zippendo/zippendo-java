name: Release

# Zippendo's release pipeline generates this SDK and pushes a version tag; this workflow signs it,
# publishes it to Maven Central and attests the jar. Maven Central has no trusted publishing, so the
# Portal token and the signing key are secrets of this repository's `release` environment, which only
# version tags can use. Every Central version is permanent: it can never be deleted or replaced.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the tag matches the artifact version
        run: test "v$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$GITHUB_REF_NAME"

      # Skipping a version Central already serves makes a failed run safe to re-run; `verify` still
      # builds the signed jars the GitHub release carries.
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/com/zippendo/zippendo-java/$version/zippendo-java-$version.pom"; then
            echo "com.zippendo:zippendo-java:$version is already on Maven Central."
            mvn -B -P sign-artifacts verify
          else
            mvn -B -P sign-artifacts deploy
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/zippendo-java-*.jar

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes \
            "Add \`com.zippendo:zippendo-java:${GITHUB_REF_NAME#v}\` to your build. Guide: https://www.zippendo.com/docs/sdks/overview" \
            target/zippendo-java-*.jar target/zippendo-java-*.jar.asc
