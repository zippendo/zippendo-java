paths:
  /health:
    get:
      description: "Return the service health status, current timestamp, and version."
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthCheck_200_response"
          description: Default Response
      summary: Health check
      tags:
      - System
      x-codeSamples:
      - lang: typescript
        label: TypeScript
        source: |-
          import { Configuration, SystemApi } from "@zippendo/sdk"

          const api = new SystemApi(new Configuration({ accessToken: process.env.ZIPPENDO_API_TOKEN }))
          const result = await api.healthCheck({  })
      - lang: python
        label: Python
        source: |-
          import os
          import zippendo

          config = zippendo.Configuration(access_token=os.environ["ZIPPENDO_API_TOKEN"])
          with zippendo.ApiClient(config) as client:
              result = zippendo.SystemApi(client).health_check()
      - lang: php
        label: PHP
        source: |-
          <?php
          $config = Zippendo\Sdk\Configuration::getDefaultConfiguration()->setAccessToken(getenv("ZIPPENDO_API_TOKEN"));
          $api = new Zippendo\Sdk\Api\SystemApi(new GuzzleHttp\Client(), $config);
          $result = $api->healthCheck();
      - lang: go
        label: Go
        source: |-
          client := zippendo.NewAPIClient(zippendo.NewConfiguration())
          ctx := context.WithValue(context.Background(), zippendo.ContextAccessToken, os.Getenv("ZIPPENDO_API_TOKEN"))
          result, _, err := client.SystemAPI.HealthCheck(ctx).Execute()
      - lang: ruby
        label: Ruby
        source: |-
          require "zippendo"

          Zippendo.configure { |c| c.access_token = ENV["ZIPPENDO_API_TOKEN"] }
          result = Zippendo::SystemApi.new.health_check()
      x-accepts:
      - application/json
  /orgs/{orgId}/api-tokens:
    get:
      description: Returns a paginated list of API tokens belonging to the specified
        organization.
      operationId: listApiTokens
      parameters:
      - description: Page number (1-based)
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          example: 1
          maximum: 9007199254740991
          minimum: 1
          type: integer
        style: form
      - description: Items per page (max 100)
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          example: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Organization ID
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          example: org_4d8af01qw2
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listApiTokens_200_response"
          description: Default Response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listApiTokens_401_response"
          description: Default Response
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listApiTokens_401_response"
          description: Default Response
      summary: List API keys
      tags:
      - Tokens
      x-codeSamples:
      - lang: typescript
        label: TypeScript
        source: |-
          import { Configuration, TokensApi } from "@zippendo/sdk"

          const api = new TokensApi(new Configuration({ accessToken: process.env.ZIPPENDO_API_TOKEN }))
          const result = await api.listApiTokens({ orgId: "..." })
      - lang: python
        label: Python
        source: |-
          import os
          import zippendo

          config = zippendo.Configuration(access_token=os.environ["ZIPPENDO_API_TOKEN"])
          with zippendo.ApiClient(config) as client:
              result = zippendo.TokensApi(client).list_api_tokens("...")
      - lang: php
        label: PHP
        source: |-
          <?php
          $config = Zippendo\Sdk\Configuration::getDefaultConfiguration()->setAccessToken(getenv("ZIPPENDO_API_TOKEN"));
          $api = new Zippendo\Sdk\Api\TokensApi(new GuzzleHttp\Client(), $config);
          $result = $api->listApiTokens("...");
      - lang: go
        label: Go
        source: |-
          client := zippendo.NewAPIClient(zippendo.NewConfiguration())
          ctx := context.WithValue(context.Background(), zippendo.ContextAccessToken, os.Getenv("ZIPPENDO_API_TOKEN"))
          result, _, err := client.TokensAPI.ListApiTokens(ctx, "...").Execute()
      - lang: ruby
        label: Ruby
        source: |-
          require "zippendo"

          Zippendo.configure { |c| c.access_token = ENV["ZIPPENDO_API_TOKEN"] }
          result = Zippendo::TokensApi.new.list_api_tokens("...")
