components:
  parameters:
    ZippendoBrandHeader:
      description: "Scope the request to one brand (sub-account), by brand ID or slug.\
        \ Omit for the organization-wide view. A brand-bound API token is already\
        \ restricted to its brand and rejects a different value."
      example: acme
      explode: false
      in: header
      name: x-zippendo-brand
      required: false
      schema:
        type: string
      style: simple
    ZippendoBrandScopeHeader:
      description: "Default for the `brandScope` list parameter when a request omits\
        \ it: \"own\" (only the current brand's rows), \"shared\" (only unassigned\
        \ rows), or \"both\". Overridden by the query parameter."
      example: own
      explode: false
      in: header
      name: x-zippendo-brand-scope
      required: false
      schema:
        enum:
        - own
        - shared
        - both
        type: string
      style: simple
  schemas:
    healthCheck_200_response:
      additionalProperties: false
      example:
        status: ok
        timestamp: 2026-06-22T14:30:00.000Z
        version: 1.0.0
      properties:
        status:
          description: Service status
          example: ok
          type: string
        timestamp:
          description: Current server time (ISO 8601)
          example: 2026-06-22T14:30:00.000Z
          type: string
        version:
          description: API version
          example: 1.0.0
          type: string
      required:
      - status
      - timestamp
      - version
      type: object
    listApiTokens_200_response_data_inner_createdBy:
      additionalProperties: false
      example:
        id: usr_9f3kd92ld0
        name: Anna Jensen
        email: anna@example.dk
      properties:
        id:
          description: Creator user identifier
          example: usr_9f3kd92ld0
          type: string
        name:
          description: Creator full name
          example: Anna Jensen
          nullable: true
          type: string
        email:
          description: Creator email address
          example: anna@example.dk
          type: string
      required:
      - email
      - id
      - name
      type: object
    listApiTokens_200_response_data_inner:
      additionalProperties: false
      example:
        id: tok_6e2fa83ij9
        name: Warehouse integration
        tokenPrefix: zipp_live_8f
        scopes:
