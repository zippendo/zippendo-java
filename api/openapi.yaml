          $ref: "#/components/schemas/createShipment_201_response_tracking"
        status:
          description: Lifecycle status of the shipment.
          enum:
          - draft
          - pending
          - processing
          - dispatched
          - partly_dispatched
          - error
          - cancelled
          - on_hold
          example: pending
          type: string
        orgId:
          description: Owning organization identifier.
          example: org_1a2b3c4d
          type: string
        orderId:
          description: Associated order identifier.
          example: ord_5e6f7a8b
          nullable: true
          type: string
        shippingRuleId:
          description: Applied shipping rule identifier.
          example: rule_3c4d5e6f
          nullable: true
          type: string
        shippingRule:
          $ref: "#/components/schemas/createShipment_201_response_shippingRule"
        labelPrinterId:
          description: Printer assigned for labels on this shipment.
          example: prn_label_01
          nullable: true
          type: string
        documentPrinterId:
          description: Printer assigned for documents on this shipment.
          example: prn_doc_01
          nullable: true
          type: string
        logs:
          default: []
          description: Request/response logs captured during carrier interactions.
          items:
            $ref: "#/components/schemas/createShipment_201_response_logs_inner"
          type: array
        activities:
          default: []
          description: Chronological activity history of the shipment.
          items:
            $ref: "#/components/schemas/createShipment_201_response_activities_inner"
          type: array
        createdAt:
          description: Timestamp when the shipment was created.
          example: 2026-06-22T14:30:00.000Z
          type: string
        updatedAt:
          description: Timestamp when the shipment was last updated.
          example: 2026-06-22T14:30:00.000Z
          type: string
      required:
      - activities
      - carrierSettings
      - createdAt
      - errors
      - id
      - logs
      - orgId
      - parcels
      - parties
      - reference
      - status
      - termOfTrade
      - type
      - updatedAt
      type: object
    updateShipment_request_carrierSettings:
      properties:
        carrierId:
          description: Identifier of the carrier to use.
          example: car_pn_001
          type: string
        productId:
          description: Identifier of the carrier product/service.
          example: prod_mypack_home
          type: string
        services:
          description: Additional service codes requested from the carrier.
          example:
          - A7
          items:
            type: string
          type: array
        additionalParameters:
          additionalProperties:
            $ref: "#/components/schemas/createShippingRule_request_additionalParameters_value"
          description: Carrier-specific extra parameters as key/value pairs.
          example:
            notificationEmail: anna@example.dk
          type: object
      required:
      - additionalParameters
      - carrierId
      - productId
      - services
      type: object
    updateShipment_request_droppoint:
      description: "Display details of the selected service point, stored alongside\
        \ `servicePointId`. Used when applying a service-point shipping rule (whose\
        \ parameters otherwise replace it)."
      example:
        id: SP-1234
        name: Brugsen Vesterbro
        address: "Vesterbrogade 12, 1620 København"
      properties:
        id:
          description: Identifier of the selected service point.
          example: sp_pn_4521
          type: string
        name:
          description: Display name of the service point.
          example: Føtex Nørrebro
          type: string
        address:
          description: Formatted address of the service point.
          example: "Nørrebrogade 20, 2200 København N"
          type: string
        coordinates:
          description: Latitude/longitude of the service point.
          example:
          - 55.6987
          - 12.5501
          items:
            $ref: "#/components/schemas/listShippingRules_200_response_data_inner_additionalParameters_value_anyOf_coordinates_inner"
          maxItems: 2
          minItems: 2
          type: array
      required:
      - address
      - id
      - name
      type: object
    updateShipment_request:
      properties:
        reference:
          description: Customer-facing shipment reference.
          example: ORDER-1042
          minLength: 1
          type: string
        addressId:
          description: Sender address identifier.
          example: addr_7e8f9a0b
          nullable: true
          type: string
        servicePointId:
          description: Selected service point ID.
          example: sp_pn_4521
          nullable: true
          type: string
        parties:
          description: Parties involved in the shipment. Optional when orderId is
            provided.
          items:
            $ref: "#/components/schemas/createShipment_request_parties_inner"
          minItems: 1
          type: array
        type:
          description: Direction of the shipment relative to the organization.
          enum:
          - outbound
          - inbound
          example: outbound
          type: string
        carrierSettings:
          $ref: "#/components/schemas/updateShipment_request_carrierSettings"
        parcels:
          description: Parcels to include. Optional when orderId is provided.
          items:
            $ref: "#/components/schemas/createShipment_request_parcels_inner"
          minItems: 1
          type: array
        pickupDetails:
          $ref: "#/components/schemas/createShipment_request_pickupDetails"
        termOfTrade:
          description: Incoterm governing the shipment.
          example: DAP
          type: string
        status:
          description: Lifecycle status of the shipment.
          enum:
          - draft
          - pending
          - processing
          - dispatched
          - partly_dispatched
          - error
          - cancelled
          - on_hold
          example: pending
          type: string
        orderId:
          description: Order to derive parties and parcels from.
          example: ord_5e6f7a8b
          nullable: true
          type: string
        labelPrinterId:
          description: Printer to assign for labels.
          example: prn_label_01
          nullable: true
          type: string
        documentPrinterId:
          description: Printer to assign for documents.
          example: prn_doc_01
          nullable: true
          type: string
        shippingRuleId:
          description: Shipping rule to apply to the shipment. Pass null to clear.
          example: rule_3c4d5e6f
          nullable: true
          type: string
        droppoint:
          $ref: "#/components/schemas/updateShipment_request_droppoint"
      type: object
