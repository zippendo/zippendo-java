          description: "DEPRECATED — use `qrCodeDataUri` (embeddable data URI) or\
            \ `qrCodeUrl` (hosted link). Catch-all that carries whichever applies,\
            \ kept populated for backwards compatibility during the migration and\
            \ until it is disabled."
          example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
          nullable: true
          type: string
        qrCodeDataUri:
          description: "Embeddable `data:` URI of the QR code image for label-free\
            \ drop-off — base64 image bytes you can drop straight into an <img>/email.\
            \ Populated whenever the image bytes are available, including for carriers\
            \ that host the image (it is fetched and inlined); null if the carrier\
            \ published no QR code or its image could not be retrieved."
          example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
          nullable: true
          type: string
        qrCodeUrl:
          description: "Carrier-hosted URL of the QR code image for label-free drop-off,\
            \ returned by carriers (e.g. Bring) that link to the image rather than\
            \ embedding it. Independent of `qrCodeDataUri` — both are set when the\
            \ hosted image was inlined successfully; null for carriers that only return\
            \ embedded bytes."
          example: https://qr.bring.com/label-free/AB12CD34.png
          nullable: true
          type: string
