          default: 20
          example: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Filter by brand. Pass a brand ID, or \"none\" for records not\
          \ assigned to any brand."
        explode: true
        in: query
        name: brandId
        required: false
        schema:
          example: brnd_8f3kd92ld0
          type: string
        style: form
      - description: "How the brand context narrows this list: \"own\" returns only\
          \ rows assigned to the current brand (requires a brand session, a brand-bound\
          \ token, or the X-Zippendo-Brand header), \"shared\" returns only unassigned\
          \ organization-wide rows, \"both\" (default) returns both. The X-Zippendo-Brand-Scope\
          \ header supplies a default when the parameter is omitted. For strictly\
          \ brand-owned records (orders, shipments), a brand-scoped request combined\
          \ with \"shared\" returns no rows, since those records are never visible\
          \ organization-wide from within a brand context."
        explode: true
        in: query
        name: brandScope
        required: false
        schema:
          enum:
          - own
          - shared
          - both
          example: own
          type: string
        style: form
      - description: Filter by shipment status.
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - draft
          - pending
          - processing
          - dispatched
          - partly_dispatched
          - error
          - cancelled
          - on_hold
          example: dispatched
          type: string
        style: form
      - description: Filter by direction.
        explode: true
        in: query
        name: type
        required: false
        schema:
          enum:
          - outbound
          - inbound
          example: outbound
          type: string
        style: form
      - description: Search by shipment reference or parcel tracking number.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: SHIP-1042
          type: string
        style: form
      - description: "Advanced filter as a JSON-encoded definition: a `conjunction`\
          \ (`and`/`or`) over `conditions`, each `{ id, field, operator, value }`\
          \ or a nested group. Fields and operators per list are documented under\
          \ Filtering lists in the API overview. An invalid filter returns 400 `FILTER_INVALID`."
        explode: true
        in: query
        name: filter
        required: false
        schema:
          example: "{\"conjunction\":\"and\",\"conditions\":[{\"id\":\"c_1\",\"field\"\
