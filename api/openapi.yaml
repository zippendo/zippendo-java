        shippingMethodMappings:
        - match: GLS Hjemmelevering
          shippingRuleId: clz9k2f0a0007abcd2468qrst
        syncOnlyUnfulfilled: true
        syncOrdersSince: 2026-05-22T00:00:00Z
        servicePointCount: 6
      properties:
        useWebhooks:
          default: true
          description: Use webhooks for real-time order sync.
          example: true
          type: boolean
        webhookId:
          description: External webhook identifier for management.
          example: gid://shopify/WebhookSubscription/12345
          nullable: true
          type: string
        webhookIds:
          description: Registered WooCommerce webhook ids.
          example:
          - 12
          - 13
          - 14
          items:
            maximum: 9007199254740991
            minimum: -9007199254740991
            type: integer
          type: array
        webhookSecretCreatedAt:
          description: When the custom channel's webhook signing secret was issued.
            A non-secret signal so clients can show that a secret exists; the secret
            itself is never returned after creation.
          example: 2026-06-22T14:30:00Z
          format: date-time
          nullable: true
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\\
            d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\\
            d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\\
            d(?:\\.\\d+)?)?(?:Z))$"
          type: string
        siteUrl:
          description: WooCommerce store URL.
          example: https://butik.dk
          format: uri
          type: string
        autoFulfill:
          description: Push tracking back to the platform when a shipment is dispatched.
            Enabled by default (opt-out) — set to false to disable write-back; an
            unset value still syncs.
          example: true
          type: boolean
        checkoutTokenCreatedAt:
          description: When the checkout token was issued (internal; never exposed
            in API responses).
          example: 2026-06-22T14:30:00Z
          format: date-time
          nullable: true
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\\
            d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\\
            d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\\
            d(?:\\.\\d+)?)?(?:Z))$"
          type: string
        autoSync:
          default: false
          description: Periodically poll the channel for new orders.
          example: false
          type: boolean
        syncIntervalMinutes:
          default: 15
          description: Polling interval in minutes (5-1440).
          example: 15
          maximum: 1440
          minimum: 5
          type: integer
        autoShipOnCreate:
          default: false
          description: Create a shipment automatically when an order arrives.
          example: false
          type: boolean
        defaultCarrierId:
          description: Default carrier ID for auto-shipping.
          example: clz9k2f0a0006abcd1357yzab
          nullable: true
          type: string
        defaultProductId:
          description: Default carrier product ID for auto-shipping.
          example: postnord-home-delivery
          nullable: true
          type: string
        defaultAddressId:
          description: Default sender address ID for auto-shipping.
          example: clz9k2f0a0005abcd7890uvwx
          nullable: true
          type: string
        shippingMethodMappings:
          description: "Map imported shipping-method titles to shipping rules, for\
            \ channels without checkout rate integration."
          example:
          - match: GLS Hjemmelevering
            shippingRuleId: clz9k2f0a0007abcd2468qrst
          items:
            $ref: "#/components/schemas/listOrderChannels_200_response_data_inner_settings_shippingMethodMappings_inner"
          type: array
        syncOnlyUnfulfilled:
          default: true
          description: Only import orders that are not yet fulfilled.
          example: true
          type: boolean
        syncOrdersSince:
          description: Only sync orders placed at or after this timestamp.
          example: 2026-05-22T00:00:00Z
          format: date-time
          nullable: true
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\\
            d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\\
            d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\\
            d(?:\\.\\d+)?)?(?:Z))$"
          type: string
        servicePointCount:
          default: 6
          description: Number of service points to show at checkout (1-20).
          example: 6
          maximum: 20
          minimum: 1
          type: integer
      required:
      - autoShipOnCreate
      - autoSync
      - servicePointCount
